<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-label="Auto Video Editor process flow">
  <defs>
    <style>
      .box{fill:#D6EAF8;stroke:#0A1E3C;stroke-width:2}
      .box2{fill:#ffffff;stroke:#0A1E3C;stroke-width:2}
      .out{fill:#0A1E3C}
      .t{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#0A1E3C;text-anchor:middle}
      .s{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#3A5A7A;text-anchor:middle}
      .w{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#ffffff;text-anchor:middle}
      .sig{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#5A7A9A;text-anchor:end}
      .arr{stroke:#0A1E3C;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A1E3C"/></marker>
  </defs>
  <rect width="1100" height="760" fill="#F4F9FD"/>
  <text x="550" y="44" class="t" style="font-size:28px;font-weight:bold">Auto Video Editor — Process Flow</text>
  <text x="550" y="72" class="s">Upload a raw video, get an edited video. Local only, no API keys, no cloud upload.</text>

  <!-- Row 1 -->
  <rect x="40" y="110" width="280" height="110" rx="14" class="box"/>
  <text x="180" y="155" class="t">1. Upload raw video</text>
  <text x="180" y="182" class="s">Web UI or CLI • mp4 / mov</text>
  <text x="180" y="202" class="s">Paste script for captions</text>

  <rect x="410" y="110" width="280" height="110" rx="14" class="box2"/>
  <text x="550" y="155" class="t">2. Validate &amp; probe</text>
  <text x="550" y="182" class="s">ffmpeg + ffprobe in PATH</text>
  <text x="550" y="202" class="s">Duration, resolution, audio</text>

  <rect x="780" y="110" width="280" height="110" rx="14" class="box2"/>
  <text x="920" y="155" class="t">3. Generate captions</text>
  <text x="920" y="182" class="s">Script split into sentences</text>
  <text x="920" y="202" class="s">SRT timed evenly over duration</text>

  <!-- Row 2 -->
  <rect x="780" y="280" width="280" height="110" rx="14" class="box"/>
  <text x="920" y="325" class="t">4. Burn captions</text>
  <text x="920" y="352" class="s">Scale to 1280×720, 30 fps</text>
  <text x="920" y="372" class="s">Subtitles burned into video</text>

  <rect x="410" y="280" width="280" height="110" rx="14" class="box2"/>
  <text x="550" y="325" class="t">5. Split into 3 parts</text>
  <text x="550" y="352" class="s">Equal parts for B-roll</text>
  <text x="550" y="372" class="s">insertion points</text>

  <rect x="40" y="280" width="280" height="110" rx="14" class="box2"/>
  <text x="180" y="325" class="t">6. Build cards</text>
  <text x="180" y="352" class="s">Intro • Key Point B-rolls • Outro</text>
  <text x="180" y="372" class="s">Light blue #D6EAF8, slow zoom</text>

  <!-- Row 3 -->
  <rect x="40" y="450" width="280" height="110" rx="14" class="box"/>
  <text x="180" y="495" class="t">7. Concatenate</text>
  <text x="180" y="522" class="s">Intro + Part 1 + B-roll +</text>
  <text x="180" y="542" class="s">Part 2 + B-roll + Part 3 + Outro</text>

  <rect x="410" y="450" width="280" height="110" rx="14" class="box2"/>
  <text x="550" y="495" class="t">8. Mix audio</text>
  <text x="550" y="522" class="s">Main audio delayed 2 s (intro)</text>
  <text x="550" y="542" class="s">+ soft BGM pad at low volume</text>

  <rect x="780" y="450" width="280" height="110" rx="14" class="out"/>
  <text x="920" y="495" class="w">9. Export edited.mp4</text>
  <text x="920" y="522" class="w" style="font-size:14px">1280×720, H.264 + AAC</text>
  <text x="920" y="542" class="w" style="font-size:14px">Ready to review, not published</text>

  <!-- Arrows row1 -->
  <path d="M320,165 L410,165" class="arr"/>
  <path d="M690,165 L780,165" class="arr"/>
  <path d="M920,220 L920,280" class="arr"/>
  <path d="M780,335 L690,335" class="arr"/>
  <path d="M410,335 L320,335" class="arr"/>
  <path d="M180,390 L180,450" class="arr"/>
  <path d="M320,505 L410,505" class="arr"/>
  <path d="M690,505 L780,505" class="arr"/>

  <text x="550" y="620" class="s">Notes: Captions require a pasted script in v1. B-roll in v1 is Key Point cards, not AI stock footage.</text>
  <text x="550" y="645" class="s">BGM in v1 is a synthesized pad. No video leaves your machine. Nothing is published automatically.</text>
  <text x="1060" y="730" class="sig">Shekar Kaki</text>
</svg>
